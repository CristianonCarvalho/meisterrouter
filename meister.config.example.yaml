# Exemplo de sobrescrita de meister/default_config.yaml.
# Copie para meister.config.yaml; listas como tier_order substituem a lista inteira.
# A ordem é a cadeia de fallback. Para trocar, reordenar ou desligar uma via,
# edite este arquivo. Haiku foi removido por decisão do usuário.

version: "1.0"
language: en  # Idioma das mensagens e relatórios (en ou pt-BR)
master:
  provider: openrouter
  model: typesafe/jev-1.13
  temperature: 0.0
  api_key_env: OPENROUTER_API_KEY
router:
  # jev escolhe a via inicial; use first para sempre escolher a primeira via, sem rede.
  # timeout_seconds e max_attempts limitam a espera por chamada ao Jev;
  # unavailable_cooldown_seconds evita novas tentativas após uma falha.
  mode: jev
  timeout_seconds: 10
  max_attempts: 2
  unavailable_cooldown_seconds: 300
  context_max_chars: 4000
retry:
  # Retenta na mesma via se o pane desaparecer ou encerrar sem resultado.
  # O backoff dobra a cada tentativa, limitado a 60 segundos.
  pane_lost_attempts: 1
  pane_lost_backoff_seconds: 5
architect:
  harness: claude
  model: claude-sonnet-5-5
  effort: high
  prompt_template: templates/architect_prompt.md
workers:
  # Timeout por inatividade (0 desliga); teto total (0 sem teto).
  idle_timeout_seconds: 600
  max_runtime_seconds: 3600
  tier_order:
    # O adaptador Copilot ocupa a primeira posição por decisão do usuário.
    # max_parallel limita onde a tarefa começa; um fallback não troca essa vaga.
    - {name: copilot_luna, harness: copilot, model: gpt-6-luna, cost_per_m_tokens: 0.20, credit_usd: 0.01, max_retries: 2, max_parallel: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    # No arquivo padrão (default_config.yaml) esta via vem desligada (enabled: false); aqui está ligada como exemplo.
    - {name: codex_luna, harness: codex, model: gpt-6-luna, cost_per_m_tokens: 0.20, max_retries: 2, max_parallel: 1, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    - {name: agy_gemini_flash, harness: agy, model: gemini-3.8-flash-high, cost_per_m_tokens: 1.50, max_retries: 2, best_for: [deep_reasoning, complex_algorithms, hard_bugs]}
    # sonnet é o apelido aceito pelo CLI claude.
    - {name: claude_sonnet, harness: claude, model: sonnet, cost_per_m_tokens: 4.00, max_retries: 1, best_for: [architectural_recovery, systemic_regressions], eligible_classes: [ESCALATE]}
concurrency:
  parallel_tasks: true
  max_parallel_workers: 4
  layout_strategy: tabs
  isolation_mode: git_worktree
scope:
  tolerated_files:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - poetry.lock
    - uv.lock
    - "*.tsbuildinfo"
    - .vitest/**
environment:
  install_dependencies: true
  install_timeout_seconds: 300
gate:
  install: null
  # Lista vazia mantém a detecção automática. Comandos são executados sem shell.
  # Exemplo Go:
  # commands:
  #   - {name: unit, run: "go test ./...", timeout_seconds: 300, required: true}
  #   - {name: lint, run: "golangci-lint run", timeout_seconds: 120, required: false}
  # Exemplo Node/pnpm:
  # commands:
  #   - {name: unit, run: "pnpm exec vitest run", timeout_seconds: 300, required: true}
  commands: []
  allow_unverified: false
  cache: true
  repair_attempts: 1  # Tentativas de conserto no mesmo worktree após reprovação no gate/escopo (0 desliga)
  # Opcional e desligado por padrão. Só substitui o gate no pré-merge e pós-merge
  # de mudanças que correspondam a paths; validate_final_integration continua completo.
  # Uma falha que apenas o gate completo detectaria reprovará o run inteiro no gate final,
  # em vez de reprovar a tarefa individual.
