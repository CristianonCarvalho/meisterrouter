  #   enabled: true
  #   paths: ["*.md", "docs/**/*.md", "docs/img/**"]
  #   commands:
  #     - {name: ruff, run: "ruff check .", timeout_seconds: 120, required: true}
  #     - name: docs
  #       run: ["{python}", "-m", "pytest", "-q", "tests/test_docs_links.py", "tests/test_hygiene.py", "tests/test_copilot_adapter.py"]
  #       timeout_seconds: 300
  #       required: true
