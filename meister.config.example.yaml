# Exemplo de sobrescrita de meister/default_config.yaml.
# Copie para meister.config.yaml; listas como tier_order substituem a lista inteira.
# A ordem é a cadeia de fallback. Para trocar, reordenar ou desligar uma via,
# edite este arquivo. Haiku foi removido por decisão do usuário.

version: "1.0"
master:
  provider: openrouter
  model: typesafe/jev-1.13
  temperature: 0.0
  api_key_env: OPENROUTER_API_KEY
router:
  # jev escolhe a via inicial; use first para sempre escolher a primeira via, sem rede.
  # timeout_seconds e max_attempts limitam a espera por chamada ao Jev;
  # unavailable_cooldown_seconds evita novas tentativas após uma falha.
  mode: jev
  timeout_seconds: 10
  max_attempts: 2
  unavailable_cooldown_seconds: 300
architect:
  harness: claude
  model: claude-sonnet-5-5
  effort: high
  prompt_template: templates/architect_prompt.md
workers:
  tier_order:
    # O adaptador Copilot ocupa a primeira posição por decisão do usuário.
    # max_parallel limita onde a tarefa começa; um fallback não troca essa vaga.
    - {name: copilot_luna, harness: copilot, model: gpt-6-luna, cost_per_m_tokens: 0.20, max_retries: 2, max_parallel: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    # No arquivo padrão (default_config.yaml) esta via vem desligada (enabled: false); aqui está ligada como exemplo.
    - {name: codex_luna, harness: codex, model: gpt-6-luna, cost_per_m_tokens: 0.077, max_retries: 2, max_parallel: 1, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    - {name: agy_gemini_flash, harness: agy, model: gemini-3.8-flash-high, cost_per_m_tokens: 0.577, max_retries: 2, best_for: [deep_reasoning, complex_algorithms, hard_bugs]}
    # sonnet é o apelido aceito pelo CLI claude.
    - {name: claude_sonnet, harness: claude, model: sonnet, cost_per_m_tokens: 3.00, max_retries: 1, best_for: [architectural_recovery, systemic_regressions]}
concurrency:
  parallel_tasks: true
  max_parallel_workers: 4
  layout_strategy: tabs
  isolation_mode: git_worktree
