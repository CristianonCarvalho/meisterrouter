router:
  # Primeira via do catálogo, sem Jev: o agy travou em planos e o Copilot concluiu os planos recentes; o fallback do tier_order continua valendo.
  mode: first
scope:
  # Uma tarefa pode editar também os arquivos declarados pelas tarefas das quais ela depende (já integradas); tarefas sem relação continuam bloqueadas.
  allow_dependency_files: true
  # Alterações em tests/ fora do escopo são aceitas se a suíte inteira passar e ficam registradas no evento scope_tolerated.
  tolerated_files:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - poetry.lock
    - uv.lock
    - "*.tsbuildinfo"
    - .vitest/**
    - tests/**
gate:
  commands:
    # O lint rápido falha cedo e mantém o feedback ágil.
    - name: ruff
      run: "{python} -m ruff check ."
      timeout_seconds: 120
      required: true
    # O mypy também roda no gate local, não apenas no CI.
    - name: mypy
      run: "{python} -m mypy meister"
      timeout_seconds: 300
      required: true
    # A suíte pode levar até três minutos; 900 s evita timeout sob carga.
    - name: pytest
      run: "{python} -m pytest -q -p no:cacheprovider"
      timeout_seconds: 900
      required: true
workers:
  # tier_order gerado pela tela /config do dashboard
  tier_order:
    - name: tier_1
      harness: copilot
      model: claude-haiku-5.5
      cost_per_m_tokens: 0.2
      credit_usd: 0.01
      max_retries: 2
      best_for:
        - small_edits
        - single_file
        - css_fixes
        - unit_test_additions
    - name: tier_1b
      harness: copilot
      model: gpt-6-luna
      cost_per_m_tokens: 0.2
      credit_usd: 0.01
      max_retries: 2
      best_for:
        - small_edits
        - single_file
        - css_fixes
        - unit_test_additions
    - name: tier_1c
      harness: codex
      model: gpt-6-luna
      cost_per_m_tokens: 0.2
      max_retries: 2
      best_for:
        - small_edits
        - single_file
        - css_fixes
        - unit_test_additions
    - name: tier_2b
      idle_timeout_seconds: 1800
      harness: claude
      model: claude-haiku-5-5
      cost_per_m_tokens: 0.2
      max_retries: 2
      eligible_classes:
        - SMALL
      best_for:
        - deep_reasoning
        - complex_algorithms
        - hard_bugs
    - name: tier_2
      harness: agy
      model: gemini-3.8-flash-high
      cost_per_m_tokens: 1.5
      max_retries: 2
      best_for:
        - deep_reasoning
        - complex_algorithms
        - hard_bugs
    - name: tier_3
      idle_timeout_seconds: 1800
      harness: claude
      model: sonnet
      cost_per_m_tokens: 4
      max_retries: 1
      eligible_classes:
        - ESCALATE
      best_for:
        - architectural_recovery
        - systemic_regressions
    - name: tier_3b
      harness: claude
      model: opus
      enabled: false
      cost_per_m_tokens: 8
      max_retries: 1
      eligible_classes:
        - ESCALATE
      best_for:
        - architectural_recovery
        - systemic_regressions
