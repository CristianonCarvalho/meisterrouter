name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.os == 'macos-latest' && ' (informativo)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # Ubuntu e Windows bloqueiam o workflow. O Windows passou a bloquear em 2026-10-11: 1811 testes sem falha e as
    # 3 últimas execuções da main verdes. A perna macOS segue informativa (não bloqueia) até o dono confirmar que
    # passa de forma estável.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # macOS e Windows só com 3.12 para limitar minutos de runner.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        # No Windows o mypy trataria as APIs so de Unix (killpg, SIGKILL, fcntl, termios, open_unix_connection) como erro;
        # com --platform linux ele verifica esses modulos como no Ubuntu. Nas outras pernas nada muda.
        run: |
          mypy ${{ matrix.os == 'windows-latest' && '--platform linux' || '' }} meister

      - name: Install tmux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux
        if: runner.os == 'macOS'
        run: |
          brew install tmux

      - name: Run Pytest
        # Na perna informativa (macOS) o pytest roda mesmo que o lint ou o mypy tenham falhado, para os testes serem
        # contados. No Ubuntu e no Windows (bloqueantes) o pytest só roda se os passos anteriores passaram.
        if: ${{ success() || (!cancelled() && matrix.os == 'macos-latest') }}
        # `-n auto` é explícito de propósito: o pytest-cov escolhe o modo de cobertura (central ou distribuído)
        # antes de tests/conftest.py ligar o xdist sozinho; sem `-n` na linha de comando, `--cov` quebra com
        # INTERNALERROR. Com `-n auto` a cobertura é combinada entre os workers. Só relatório, sem limite mínimo.
        run: |
          pytest -v --durations=15 -n auto --cov=meister --cov-report=term-missing

      - name: Real Maven gate test
        # Roda o gate num projeto Maven de verdade (sem mvn simulado). No Windows o runner já traz Maven e o JDK 8
        # (JAVA_HOME_8_X64), o que cobre mvn.cmd, PATHEXT e caminhos do Windows; no Ubuntu só a perna 3.12.
        if: matrix.os == 'windows-latest' || (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12')
        env:
          MEISTER_REAL_MAVEN: '1'
          # O limite padrão de 180 s por teste não bastaria na primeira execução, que baixa plugins do Maven Central.
          MEISTER_TEST_TIMEOUT: '600'
        run: |
          pytest tests/test_gate_maven_real.py -v -p no:cacheprovider

      - name: Security scan with Bandit (informativo)
        continue-on-error: true
        run: |
          bandit -r meister -q

      - name: Dependency audit with pip-audit (informativo)
        continue-on-error: true
        run: |
          pip-audit
