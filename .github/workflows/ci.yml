name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && ' (informativo)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # As pernas macOS e Windows são informativas (não bloqueiam o workflow). A do macOS fica assim até o dono
    # confirmar que passa de forma estável. A do Windows existe para medir quantos testes falham hoje: o código
    # usa APIs de Unix (fcntl, killpg, ps) e ainda não declara suporte nativo ao Windows.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # macOS e Windows só com 3.12 para limitar minutos de runner.
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Type check with Mypy
        run: |
          mypy meister

      - name: Run Pytest
        # Nas pernas informativas (macOS e Windows) o pytest roda mesmo que o lint ou o mypy tenham falhado: no Windows
        # o mypy aponta APIs só de Unix (SIGKILL, killpg, termios) e, sem isto, os testes nunca seriam contados. O job
        # continua vermelho nesse caso. No Ubuntu nada muda: o pytest só roda se os passos anteriores passaram.
        if: ${{ success() || (!cancelled() && matrix.os != 'ubuntu-latest') }}
        # `-n auto` é explícito de propósito: o pytest-cov escolhe o modo de cobertura (central ou distribuído)
        # antes de tests/conftest.py ligar o xdist sozinho; sem `-n` na linha de comando, `--cov` quebra com
        # INTERNALERROR. Com `-n auto` a cobertura é combinada entre os workers. Só relatório, sem limite mínimo.
        run: |
          pytest -v --durations=15 -n auto --cov=meister --cov-report=term-missing

      - name: Security scan with Bandit (informativo)
        continue-on-error: true
        run: |
          bandit -r meister -q

      - name: Dependency audit with pip-audit (informativo)
        continue-on-error: true
        run: |
          pip-audit
