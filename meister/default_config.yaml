version: "1.0"
master:
  provider: openrouter
  model: typesafe/jev-1.13
  temperature: 0.0
  api_key_env: OPENROUTER_API_KEY
router:
  # jev escolhe a via inicial; use first para sempre escolher a primeira via, sem rede.
  # Estes valores limitam a espera pelo Jev e o tempo para evitá-lo após uma falha.
  mode: jev
  timeout_seconds: 10
  max_attempts: 2
  unavailable_cooldown_seconds: 300
retry:
  pane_lost_attempts: 1
  pane_lost_backoff_seconds: 5
architect:
  harness: claude
  model: claude-sonnet-5-5
  effort: high
  prompt_template: templates/architect_prompt.md
workers:
  idle_timeout_seconds: 600
  max_runtime_seconds: 3600
  tier_order:
    # A ordem define a cadeia de fallback, sempre para a frente.
    # Copilot vem primeiro por decisão do usuário: os créditos do Codex são limitados.
    - {name: copilot_luna, harness: copilot, model: gpt-6-luna, cost_per_m_tokens: 0.20, max_retries: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    # Desligada por decisão do usuário: os créditos do Codex são poucos. Troque para enabled: true ou use a via só quando quiser.
    - {name: codex_luna, harness: codex, model: gpt-6-luna, enabled: false, cost_per_m_tokens: 0.077, max_retries: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    - {name: agy_gemini_flash, harness: agy, model: gemini-3.8-flash-high, cost_per_m_tokens: 0.577, max_retries: 2, best_for: [deep_reasoning, complex_algorithms, hard_bugs]}
    # sonnet é o apelido aceito pelo CLI claude.
    - {name: claude_sonnet, harness: claude, model: sonnet, cost_per_m_tokens: 3.00, max_retries: 1, best_for: [architectural_recovery, systemic_regressions]}
# Para alterar modelos, custos, ordem ou habilitação, sobrescreva este arquivo com
# meister.config.yaml no projeto (listas como tier_order substituem a lista inteira).
# Haiku foi omitido por decisão do usuário (custo alto e capacidade insuficiente).
concurrency:
  parallel_tasks: true
  max_parallel_workers: 4
  layout_strategy: tabs
  isolation_mode: git_worktree
scope:
  tolerated_files:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - poetry.lock
    - uv.lock
    - "*.tsbuildinfo"
    - .vitest/**
environment:
  install_dependencies: true
  install_timeout_seconds: 300
gate:
  install: null
  commands: []
  allow_unverified: false
