version: "1.0"
language: en  # Idioma das mensagens e relatórios (en ou pt-BR)
master:
  provider: openrouter
  model: typesafe/jev-1.13
  temperature: 0.0
  api_key_env: OPENROUTER_API_KEY
router:
  # jev escolhe a via inicial; use first para sempre escolher a primeira via, sem rede.
  # Estes valores limitam a espera pelo Jev e o tempo para evitá-lo após uma falha.
  mode: jev
  timeout_seconds: 10
  max_attempts: 2
  unavailable_cooldown_seconds: 300
  context_max_chars: 4000
retry:
  pane_lost_attempts: 1
  pane_lost_backoff_seconds: 5
architect:
  harness: claude
  model: claude-sonnet-5-5
  effort: high
  prompt_template: templates/architect_prompt.md
workers:
  idle_timeout_seconds: 600
  max_runtime_seconds: 3600
  tier_order:
    # effort is optional; when omitted, the harness uses its default.
    # Values by harness: copilot/github-copilot = none, minimal, low, medium, high, xhigh, max;
    # claude/agy/antigravity = low, medium, high, xhigh, max; codex = minimal, low, medium, high, xhigh.
    # A ordem define a cadeia de fallback, sempre para a frente.
    # cost_per_m_tokens = preço combinado 3:1 (3 partes de entrada para 1 de saída), como no Artificial Analysis.
    # Fonte: OpenRouter (/api/v1/models) e Artificial Analysis, conferidos em 2026-10-05;
    # Haiku 5.5: OpenRouter, conferido em 2026-10-08.
    #   Haiku 5.5: 0.10/0.50 -> 0.20 até 100k tokens por pedido; 0.50/2.50 -> 1.00 acima de 100k.
    #   Luna 0.10/0.50 -> 0.20 | Gemini 3.8 Flash 0.75/3.75 -> 1.50 | Sonnet 5.5 2.00/10.00 -> 4.00 | Opus 5.5 4.00/20.00 -> 8.00 (USD por 1M tokens)
    # O esforço de raciocínio não muda o preço por token, só os tokens gastos. Custo por tarefa no Artificial Analysis
    # (benchmark de raciocínio): Sonnet 5.5 high 1.12 | Gemini 3.8 Flash high 1.24 | Luna high 0.03 (USD).
    # Copilot vem primeiro por decisão do usuário: os créditos do Codex são limitados.
    # 1 crédito do Copilot = US$ 0,01 (docs.github.com, 2026-10)
    # O custo da tier_1 usa a faixa até 100k tokens; acima disso o combinado é US$ 1.00.
    - {name: tier_1, harness: copilot, model: claude-haiku-5.5, cost_per_m_tokens: 0.20, credit_usd: 0.01, max_retries: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    - {name: tier_1b, harness: copilot, model: gpt-6-luna, cost_per_m_tokens: 0.20, credit_usd: 0.01, max_retries: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    # Desligada por decisão do usuário: os créditos do Codex são poucos. Troque para enabled: true ou use a via só quando quiser.
    - {name: tier_1c, harness: codex, model: gpt-6-luna, enabled: false, cost_per_m_tokens: 0.20, max_retries: 2, best_for: [small_edits, single_file, css_fixes, unit_test_additions]}
    - {name: tier_2, harness: agy, model: gemini-3.8-flash-high, cost_per_m_tokens: 1.50, max_retries: 2, best_for: [deep_reasoning, complex_algorithms, hard_bugs]}
    # sonnet e opus são os apelidos aceitos pelo CLI claude.
    # Só roteada pelo Jev para classe ESCALATE; as demais vias ficam sem restrição.
    - {name: tier_3, harness: claude, model: sonnet, cost_per_m_tokens: 4.00, max_retries: 1, best_for: [architectural_recovery, systemic_regressions], eligible_classes: [ESCALATE]}
    - {name: tier_3b, harness: claude, model: opus, enabled: false, cost_per_m_tokens: 8.00, max_retries: 1, best_for: [architectural_recovery, systemic_regressions], eligible_classes: [ESCALATE]}
# Para alterar modelos, custos, ordem ou habilitação, sobrescreva este arquivo com
# meister.config.yaml no projeto (listas como tier_order substituem a lista inteira).
concurrency:
  parallel_tasks: true
  max_parallel_workers: 4
  layout_strategy: tabs
  isolation_mode: git_worktree
scope:
  tolerated_files:
    - pnpm-lock.yaml
    - package-lock.json
    - yarn.lock
    - poetry.lock
    - uv.lock
    - "*.tsbuildinfo"
    - .vitest/**
environment:
  install_dependencies: true
  install_timeout_seconds: 300
dashboard:
  open: auto
  idle_exit_minutes: 30
  window:
    width: 1280
    height: 800
gate:
  install: null
  python: null
  commands: []
  allow_unverified: false
  cache: true
  repair_attempts: 1  # Tentativas de conserto no mesmo worktree após reprovação no gate/escopo (0 desliga)
  flaky_retries: 2  # Reexecuções só dos testes pytest que falharam antes de reprovar (0 desliga)
  docs_only:
    enabled: false
    paths: ["*.md", "docs/**/*.md", "docs/img/**"]
    commands: []
